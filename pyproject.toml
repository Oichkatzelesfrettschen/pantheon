[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spandrel"
version = "1.0.0"
description = "Cosmological hypothesis testing and Type Ia supernova DDT simulation"
readme = "README.md"
license = {text = "GPL-2.0-only"}
requires-python = ">=3.9"
authors = [
    {name = "Eirikr"}
]
keywords = [
    "cosmology",
    "supernova",
    "dark-energy",
    "hydrodynamics",
    "nucleosynthesis",
    "pantheon"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
]

dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "spandrel-core @ git+https://github.com/Oichkatzelesfrettschen/spandrel-core.git@52c2c9c6c9f60ce9b5e2e42c6bbb7312a8e144cc",
]

[project.optional-dependencies]
gpu = ["mlx>=0.0.1; sys_platform == 'darwin'"]
jit = ["numba>=0.55"]
all = [
    "mlx>=0.0.1; sys_platform == 'darwin'",
    "numba>=0.55",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
"Source" = "https://github.com/Oichkatzelesfrettschen/pantheon"
"Pantheon+SH0ES" = "https://pantheonplussh0es.github.io/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spandrel*"]

[project.scripts]
spandrel = "spandrel.cli:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (likely bugs and design problems)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports in tests are often intentional
# E402: these files set os/warnings config before imports -- correct pattern
"src/spandrel/analysis/spandrel_joint_analysis.py" = ["E402"]
"src/spandrel/cosmology/desi_riemann_synthesis.py" = ["E402"]
"src/spandrel/cosmology/riemann_resonance_cosmology.py" = ["E402"]
"src/spandrel/cosmology/spandrel_cosmology.py" = ["E402"]
"src/spandrel/cosmology/spandrel_cosmology_hpc.py" = ["E402"]
"src/spandrel/elevated/ddt_parameter_study.py" = ["E402"]
"src/spandrel/elevated/model_comparison.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=spandrel --cov-report=term-missing"

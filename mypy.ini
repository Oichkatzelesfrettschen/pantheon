[mypy]
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
no_implicit_optional = True

# Tier 1 (fully typed): shared constants and data interface.
# Tier 2 (well-typed): DDT solver modules have explicit type annotations.
# Higher-level analyses/synthesis remain research code and are excluded for now.
files = src/spandrel/core, src/spandrel/ddt
exclude = ^docs/|^tests/|^results/|^data/|^src/spandrel/(analysis|cosmology|elevated|synthesis|visuals)/
